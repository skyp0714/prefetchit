# Run compose-review-service from a rebuilt (clang-19 + PrefetchIT) fat-static binary: ${SVC_BIN}/ComposeReviewService in image ${SVC_IMG}, /usr/local/lib from ${SVC_LIBS}.
services:
  compose-review-service:
    image: ${SVC_IMG}
    working_dir: /media-microservices
    entrypoint: ["/custom/ComposeReviewService"]
    volumes:
      - ${SVC_BIN}:/custom:ro
      - ${SVC_LIBS}:/usr/local/lib:ro
      - /home/hnpark2/prefetchit/benchmarks/DeathStarBench/mediaMicroservices/config:/media-microservices/config:ro
